name: Docker Build & Push (GHCR + Docker Hub)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像 tag（留空则用 package.json 版本号）'
        required: false
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # 推 ghcr.io 必需
    outputs:
      version: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v5

      - name: Compute version
        id: meta
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            VERSION="${{ github.event.inputs.tag }}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # metadata-action 自动把镜像名转全小写（GHCR 硬要求），
      # 不再走 output 传递镜像名，规避 "Skip output ... may contain secret" 问题
      - name: Docker meta (tags & labels)
        id: tags
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ secrets.DOCKERHUB_USERNAME }}/qq-music-api
          tags: |
            type=raw,value=${{ steps.meta.outputs.version }}
            type=raw,value=latest

      - name: Build & push (multi-registry)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.dockerhub
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.tags.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-server:
    needs: build-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to my server (pull GHCR image)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            GHCR_IMAGE="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
            # GHCR 包为 Private 时需要下面这行 login（PAT 需 read:packages）；改 Public 后可删
            echo "${{ secrets.GHCR_DEPLOY_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_DEPLOY_USER }}" --password-stdin
            docker pull "$GHCR_IMAGE:latest"
            docker stop qq-music-api 2>/dev/null || true
            docker rm   qq-music-api 2>/dev/null || true
            docker run -d --name qq-music-api \
              -p 3200:3200 \
              -e USE_GLOBAL_COOKIE=true \
              -v /opt/qq-music-api/config:/app/config \
              --restart unless-stopped \
              "$GHCR_IMAGE:latest"
            docker image prune -f
