name: Docker Build & Push

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像 tag（留空则用 latest）'
        required: false
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Compute image tag
        id: meta
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/v}"
          else
            TAG=$(node -p "require('./package.json').version")
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/qq-music-api:${{ steps.meta.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/qq-music-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-server:
    needs: build-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to my server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/qq-music-api:latest
            docker stop qq-music-api 2>/dev/null || true
            docker rm   qq-music-api 2>/dev/null || true
            docker run -d --name qq-music-api \
              -p 3200:3200 \
              -e USE_GLOBAL_COOKIE=true \
              -v /opt/qq-music-api/config:/app/config \
              --restart unless-stopped \
              ${{ secrets.DOCKERHUB_USERNAME }}/qq-music-api:latest
