name: Docker Build & Push (GHCR + Docker Hub)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像 tag（留空则用 package.json 版本号）'
        required: false
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # 推 ghcr.io 必需
    # 跨 job 传递镜像名与版本号（step 输出跨 job 不可见，必须走 job outputs）
    outputs:
      repo_lc: ${{ steps.meta.outputs.repo_lc }}
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v5

      - name: Compute image tag & lowercase repo
        id: meta
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/v}"
          else
            TAG=$(node -p "require('./package.json').version")
          fi
          # GHCR 要求镜像路径必须全小写
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "repo_lc=$REPO_LC" >> "$GITHUB_OUTPUT"
          echo "Version tag: $TAG / GHCR image: ghcr.io/$REPO_LC"

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push (multi-registry)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.dockerhub
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo_lc }}:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ steps.meta.outputs.repo_lc }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/qq-music-api:${{ steps.meta.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/qq-music-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-server:
    needs: build-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to my server (pull GHCR image)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            GHCR_IMAGE="ghcr.io/${{ needs.build-push.outputs.repo_lc }}"
            # 包是 Public 时可删除下面这行 login；Private 包需要 read:packages 的 PAT
            echo "${{ secrets.GHCR_DEPLOY_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_DEPLOY_USER }}" --password-stdin
            docker pull "$GHCR_IMAGE:latest"
            docker stop qq-music-api 2>/dev/null || true
            docker rm   qq-music-api 2>/dev/null || true
            docker run -d --name qq-music-api \
              -p 3200:3200 \
              -e USE_GLOBAL_COOKIE=true \
              -v /opt/qq-music-api/config:/app/config \
              --restart unless-stopped \
              "$GHCR_IMAGE:latest"
            docker image prune -f
